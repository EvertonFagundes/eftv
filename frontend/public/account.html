<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha conta — EFTV</title>
  <meta name="description" content="Gerencie sua assinatura EFTV">
  <meta name="theme-color" content="#071426">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html" aria-label="EFTV — início">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.4v13.2L19 12z"/></svg></span>
        <span class="brand-name">EF<b>TV</b></span>
      </a>
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="account.html" class="is-active">Minha conta</a>
        <a href="plans.html">Planos</a>
      </nav>
      <div class="header-actions">
        <span class="user-greeting" id="user-greeting"></span>
        <button class="btn btn-ghost" id="logout-btn">Sair</button>
      </div>
    </div>
  </header>

  <main class="account-page">
    <div class="wrap">
      <nav class="account-tabs" aria-label="Seções da conta">
        <button class="account-tab is-active" data-tab="subscription">Minha assinatura</button>
        <button class="account-tab" data-tab="profile">Perfil</button>
        <button class="account-tab" data-tab="payments">Pagamentos</button>
        <button class="account-tab" data-tab="devices">Dispositivos</button>
      </nav>

      <!-- Aba: Minha Assinatura -->
      <section class="account-panel is-active" id="panel-subscription" role="tabpanel">
        <div class="subscription-card" id="subscription-card">
          <div class="subscription-loading">Carregando...</div>
        </div>

        <div class="subscription-actions" id="subscription-actions" hidden>
          <!-- Botões dinâmicos -->
        </div>
      </section>

      <!-- Aba: Perfil -->
      <section class="account-panel" id="panel-profile" role="tabpanel" hidden>
        <form id="profile-form" class="account-form">
          <h2>Dados pessoais</h2>
          <div class="form-row">
            <div class="form-group">
              <label for="profile_name">Nome completo</label>
              <input type="text" id="profile_name" name="full_name" required>
            </div>
            <div class="form-group">
              <label for="profile_email">Email</label>
              <input type="email" id="profile_email" name="email" required disabled>
              <small class="form-hint">Email não pode ser alterado</small>
            </div>
          </div>
          <div class="form-group">
            <label for="profile_phone">WhatsApp</label>
            <input type="tel" id="profile_phone" name="phone" placeholder="(11) 99999-9999">
          </div>
          <button type="submit" class="btn btn-primary">Salvar alterações</button>
        </form>

        <hr class="section-divider">

        <form id="password-form" class="account-form">
          <h2>Alterar senha</h2>
          <div class="form-group">
            <label for="current_password">Senha atual</label>
            <input type="password" id="current_password" name="current_password" required>
          </div>
          <div class="form-group">
            <label for="new_password">Nova senha</label>
            <input type="password" id="new_password" name="new_password" required minlength="8">
            <div class="password-strength" id="password-strength-2"></div>
          </div>
          <div class="form-group">
            <label for="confirm_new_password">Confirmar nova senha</label>
            <input type="password" id="confirm_new_password" name="confirm_new_password" required>
          </div>
          <button type="submit" class="btn btn-primary">Atualizar senha</button>
        </form>
      </section>

      <!-- Aba: Pagamentos -->
      <section class="account-panel" id="panel-payments" role="tabpanel" hidden>
        <h2>Histórico de pagamentos</h2>
        <div class="payments-list" id="payments-list">
          <div class="empty-state">Carregando...</div>
        </div>
      </section>

      <!-- Aba: Dispositivos -->
      <section class="account-panel" id="panel-devices" role="tabpanel" hidden>
        <h2>Dispositivos conectados</h2>
        <p class="section-hint">Sessões ativas nos últimos 30 dias</p>
        <div class="devices-list" id="devices-list">
          <div class="empty-state">Carregando...</div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2024 EFTV. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="assets/js/account-page.js"></script>
</body>
</html>
