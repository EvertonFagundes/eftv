<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar assinatura — EFTV</title>
  <meta name="description" content="Crie sua conta e assine a EFTV">
  <meta name="theme-color" content="#071426">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html" aria-label="EFTV — início">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.4v13.2L19 12z"/></svg></span>
        <span class="brand-name">EF<b>TV</b></span>
      </a>
    </div>
  </header>

  <main class="auth-page">
    <div class="wrap">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-logo" aria-label="Voltar ao início">
            <svg viewBox="0 0 24 24"><path d="M8 5.4v13.2L19 12z"/></svg>
            <span>EF<b>TV</b></span>
          </a>
          <h1>Criar sua assinatura</h1>
          <p>Preencha seus dados e escolha um plano</p>
        </div>

        <form id="register-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="full_name">Nome completo</label>
            <input type="text" id="full_name" name="full_name" autocomplete="name" required placeholder="João da Silva">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required placeholder="seu@email.com">
          </div>

          <div class="form-group">
            <label for="phone">WhatsApp (opcional)</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="(11) 99999-9999">
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" placeholder="Mínimo 8 caracteres">
            <div class="password-strength" id="password-strength" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="confirm_password">Confirmar senha</label>
            <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required placeholder="Repita a senha">
          </div>

          <fieldset class="form-group plan-selector">
            <legend>Escolha seu plano</legend>
            <div class="plan-options" id="plan-options">
              <!-- Preenchido via JS -->
            </div>
            <input type="hidden" id="selected_plan" name="plan_id" required>
          </fieldset>

          <div class="form-group terms">
            <label>
              <input type="checkbox" name="terms" required>
              Li e aceito os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
            <span class="btn-text">Continuar para pagamento</span>
            <span class="btn-loading" hidden>Processando...</span>
          </button>
        </form>

        <p class="auth-switch">
          Já tem conta? <a href="login.html">Entrar</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2024 EFTV. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="assets/js/register-page.js"></script>
</body>
</html>
