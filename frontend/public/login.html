<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — EFTV</title>
  <meta name="description" content="Acesse sua conta EFTV">
  <meta name="theme-color" content="#071426">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html" aria-label="EFTV — início">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.4v13.2L19 12z"/></svg></span>
        <span class="brand-name">EF<b>TV</b></span>
      </a>
    </div>
  </header>

  <main class="auth-page">
    <div class="wrap">
      <div class="auth-card">
        <div class="auth-header">
          <a href="index.html" class="auth-logo" aria-label="Voltar ao início">
            <svg viewBox="0 0 24 24"><path d="M8 5.4v13.2L19 12z"/></svg>
            <span>EF<b>TV</b></span>
          </a>
          <h1>Entrar na sua conta</h1>
          <p>Use seu email e senha para acessar</p>
        </div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required placeholder="seu@email.com">
          </div>

          <div class="form-group">
            <div class="form-group-header">
              <label for="password">Senha</label>
              <a href="forgot.html" class="forgot-link">Esqueci a senha</a>
            </div>
            <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>

        <div class="auth-divider">
          <span>ou</span>
        </div>

        <p class="auth-switch">
          Não tem conta? <a href="register.html">Criar assinatura</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2024 EFTV. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script type="module" src="assets/js/auth-page.js"></script>
</body>
</html>
