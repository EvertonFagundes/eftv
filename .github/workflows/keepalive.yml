# .github/workflows/keepalive.yml - Evita que a API do Render durma
#
# O plano free do Render desliga o servico depois de 15 minutos sem
# requisicao. Um ping a cada 10 minutos mantem a instancia acordada.
#
# Observacoes:
#   - consome as 750 horas de instancia free do mes (~730h em um mes cheio);
#   - o banco free continua expirando 30 dias depois de criado;
#   - o GitHub pode atrasar execucoes agendadas em horarios de pico.
# Para producao de verdade, o correto e subir para o plano pago.

name: Manter API acordada

on:
  schedule:
    # A cada 10 minutos (o minimo do GitHub e 5).
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Se uma execucao atrasar, nao acumula outra em paralelo.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acordar a API
        run: |
          URL="https://eftv.onrender.com/health"
          for tentativa in 1 2 3; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" -m 120 "$URL" || true)
            if [ "$codigo" = "200" ]; then
              echo "API respondendo (HTTP 200) na tentativa $tentativa."
              exit 0
            fi
            echo "Tentativa $tentativa: HTTP ${codigo:-sem resposta}"
            sleep 20
          done
          echo "A API nao respondeu depois de 3 tentativas."
          exit 1
