# .github/workflows/keepalive.yml - Evita que a API do Render durma
#
# O cron do GitHub e pouco confiavel: em horarios de pico ele entrega poucas
# execucoes por dia (ja houve intervalo de 16h). Um cron sozinho nao garante
# que o Render (free) fique acordado, porque a instancia dorme apos ~15 min.
#
# Solucao: corrente continua. Cada execucao pinga a API e dispara a proxima
# com um atraso de 9 minutos via workflow_dispatch (que nao sofre o atraso do
# cron). O cron de 5 minutos fica apenas como reserva/reinicio da corrente.

name: Manter API acordada

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "Esperar o intervalo e continuar a corrente"
        required: false
        default: true
        type: boolean
      delay:
        description: "Segundos ate o proximo ping"
        required: false
        default: "540"
        type: string

permissions:
  actions: write
  contents: read

# Uma execucao por vez; as seguintes esperam na fila.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Intervalo da corrente
        if: github.event_name == 'workflow_dispatch' && inputs.chain
        run: sleep "${{ inputs.delay || '540' }}"

      - name: Acordar a API
        id: acordar
        continue-on-error: true
        run: |
          URL="${{ vars.KEEPALIVE_URL || 'https://eftv.onrender.com/ping' }}"
          for tentativa in 1 2 3 4; do
            codigo=$(curl -sS -o /dev/null -w "%{http_code}" -m 45 "$URL" || true)
            if [ "$codigo" = "200" ]; then
              echo "API respondendo (HTTP 200) na tentativa $tentativa."
              exit 0
            fi
            echo "Tentativa $tentativa: HTTP ${codigo:-sem resposta}"
            sleep 10
          done
          echo "A API nao respondeu depois de 4 tentativas."
          exit 1

      - name: Agenda o proximo ping
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Nao cria duas correntes paralelas: se ja existe uma execucao na
          # fila, ela mesma vai agendar a proxima quando rodar.
          fila=$(gh api "/repos/$REPO/actions/workflows/keepalive.yml/runs?status=queued&per_page=100" \
            --jq '.total_count' 2>/dev/null || echo "0")
          if [ "$fila" -gt 0 ]; then
            echo "Ja existe ping na fila; nao agendando outro."
            exit 0
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/workflows/keepalive.yml/dispatches" \
            -f ref=main \
            -f 'inputs[chain]=true' \
            -f 'inputs[delay]=540'
          echo "Proximo ping agendado para ~9 minutos."
