# Compila e assina o APK de release do EFTV.
# Dispara ao publicar uma tag (ex.: v1.4.9) ou manualmente em Actions.
#
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   - eftv-release.jks em base64 (-w0)
#   ANDROID_KEYSTORE_PASSWORD - senha do keystore
#   ANDROID_KEY_ALIAS         - alias da chave (eftv)
#   ANDROID_KEY_PASSWORD      - senha da chave
#
# Sem esses secrets o build falha de proposito: nunca publique APK sem assinar.
name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configurar assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/eftv-release.jks
          chmod 600 android/eftv-release.jks
          {
            echo "storeFile=eftv-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore.properties

      - name: Build do APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verificar assinatura
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Renomear APK
        run: |
          set -euo pipefail
          NOME="eftv-${GITHUB_REF_NAME:-manual}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NOME"
          echo "APK_NOME=$NOME" >> "$GITHUB_ENV"

      - name: Anexar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NOME }}
          body: |
            APK assinado do EFTV ${{ github.ref_name }}.

            SHA-256 do APK: `${{ env.APK_SHA256 }}`

            Se o Android recusar a instalacao por assinatura diferente,
            desinstale a versao antiga e instale este APK. Sua conta,
            assinatura e dispositivos continuam valendo.

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: eftv-apk
          path: ${{ env.APK_NOME }}
          if-no-files-found: error
